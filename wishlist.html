<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wishlist</title>

  <link rel="stylesheet" href="style.css">

  <style>

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .wishlist-section {
      padding: 120px 8%;
      min-height: 100vh;
      background: #f8f8f8;
    }

    .wishlist-title {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 40px;
      color: #111;
    }

    .wishlist-item {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .wishlist-item:hover {
      transform: translateY(-5px);
    }

    .wishlist-img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      background: #f3f3f3;
      border-radius: 15px;
      padding: 10px;
    }

    .wishlist-details {
      flex: 1;
      padding: 0 20px;
    }

    .wishlist-details h2 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #111;
    }

    .wishlist-details p {
      font-size: 20px;
      font-weight: 600;
      color: #ff6b00;
    }

    .remove-btn {
      background: #111;
      color: #fff;
      border: none;
      padding: 14px 25px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .remove-btn:hover {
      background: crimson;
    }

    .empty-wishlist {
      background: white;
      padding: 50px;
      text-align: center;
      border-radius: 20px;
      font-size: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    @media(max-width: 900px) {

      .wishlist-item {
        flex-direction: column;
        text-align: center;
      }

      .wishlist-img {
        width: 100%;
        max-width: 250px;
        height: auto;
      }
    }

  </style>

</head>

<body>

  <section class="wishlist-section">

    <h1 class="wishlist-title">My Wishlist</h1>

    <div id="wishlist-items"></div>

  </section>

  <script src="./wishlist.js"></script>

</body>

</html>
