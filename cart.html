<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Bag - Footcap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       RESET & THEME CORE VARIABLES
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    :root {
      --bg-main: #ffffff;
      --bg-surface: #f8f9fa;
      --border-color: #e4e7eb;
      --text-main: #1d2022;
      --text-muted: #64748b;
      --accent-red: #d91a24;
      --focus-glow: rgba(217, 26, 36, 0.12);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================================================
       TOP APP HEADER FRAME
       ========================================================================== */
    header {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 35px 40px 15px 40px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .brand-title span {
      color: var(--accent-red);
    }

    /* ==========================================================================
       ASYMMETRIC MAIN GRID FRAMEWORK
       ========================================================================== */
    .cart-container {
      display: flex;
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      gap: 20px;
    }

    /* Left Column: Flow Items List */
    .items-column {
      flex: 1.3;
      padding: 20px 40px 60px 40px;
    }

    /* Right Column: Sticky Pricing Panel Layout */
    .summary-column {
      flex: 0.7;
      background-color: var(--bg-surface);
      border-left: 1px solid var(--border-color);
      padding: 40px 40px 60px 50px;
    }

    .page-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 35px;
    }

    /* ==========================================================================
       PREMIUM PRODUCT CONTAINER CARDS
       ========================================================================== */
    .cart-item {
      display: flex;
      align-items: center;
      padding: 25px 0;
      border-bottom: 1px solid var(--border-color);
      gap: 24px;
      transition: all 0.2s ease;
    }

    .cart-img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      background-color: var(--bg-surface);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid var(--border-color);
    }

    .cart-details {
      flex: 1;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      align-items: center;
      gap: 16px;
    }

    .item-meta h2 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .item-unit-price {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Interactive Smooth Increment Box Matrix */
    .qty-control-wrapper {
      display: inline-flex;
      align-items: center;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 4px;
      width: fit-content;
    }

    .qty-control-wrapper button {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .qty-control-wrapper button:hover {
      background-color: var(--bg-main);
      color: var(--accent-red);
    }

    .qty-control-wrapper span {
      font-size: 14px;
      font-weight: 700;
      min-width: 32px;
      text-align: center;
    }

    .item-subtotal-price {
      font-size: 16px;
      font-weight: 700;
      text-align: right;
      color: var(--text-main);
    }

    /* Elegant Textual Action Triggers */
    .remove-action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px;
      transition: color 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .remove-action-btn:hover {
      color: var(--accent-red);
    }

    /* ==========================================================================
       SIDE PANEL TRANSACTION BAR STRUCTURE
       ========================================================================== */
    .summary-sticky {
      position: sticky;
      top: 40px;
    }

    .summary-heading {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pricing-ledger-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 30px;
    }

    .ledger-row-entry {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .ledger-row-entry.grand-total {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      padding-top: 16px;
      border-top: 1px dashed var(--border-color);
    }

    /* Primary CTA Execution System */
    .checkout-execution-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background-color: var(--text-main);
      color: var(--bg-main);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .checkout-execution-btn:hover {
      background-color: var(--accent-red);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px var(--focus-glow);
    }

    /* Zero State Clean Layout */
    .empty-cart-state {
      padding: 80px 0;
      text-align: center;
    }

    .empty-cart-state h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* ==========================================================================
       FLUID RESPONSIVE DESIGN MATRIX
       ========================================================================== */
    @media (max-width: 992px) {
      .cart-container {
        flex-direction: column;
      }
      .items-column, .summary-column {
        padding: 30px 24px;
        flex: none;
      }
      .cart-details {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .item-subtotal-price {
        text-align: left;
      }
    }

    @media (max-width: 480px) {
      .cart-item {
        flex-direction: column;
        align-items: flex-start;
      }
      .cart-img {
        width: 100%;
        max-width: 160px;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">FOOT<span>CAP</span></div>
  </header>

  <main class="cart-container">
    
    <section class="items-column">
      <h1 class="page-title">Your Bag</h1>
      <div id="cart-items"></div>
    </section>

    <aside class="summary-column">
      <div class="summary-sticky">
        <h2 class="summary-heading">Summary</h2>
        
        <div class="pricing-ledger-group">
          <div class="ledger-row-entry">
            <span>Subtotal</span>
            <span>$<span id="summary-subtotal">0.00</span></span>
          </div>
          <div class="ledger-row-entry">
            <span>Estimated Logistics Freight</span>
            <span>Standard (Free)</span>
          </div>
          <div class="ledger-row-entry grand-total">
            <span>Total</span>
            <span>$<span id="cart-total">0.00</span></span>
          </div>
        </div>

        <button id="checkout-btn" class="checkout-execution-btn">Proceed To Checkout</button>
      </div>
    </aside>

  </main>

  <script src="./cart.js"></script>
</body>
</html>
